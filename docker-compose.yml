# Exemplo. Segredos (MCP_ENDPOINT, FERIADOS_API_KEY, FERIADOS_UF) ficam no .env
# ou no Infisical (USE_INFISICAL=1).
services:
  dobi-mcp:
    build: .  # imagem já traz o CLI do Infisical; uso ligado por USE_INFISICAL
    image: dobi-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      # Oficiais (tools/, dentro da imagem) ativas; sobrepõe config.yaml.
      # Personalizadas (custom_tools/) sobem todas, só por estarem no volume.
      ENABLED_TOOLS: calculo,tempo,sistema,feriados
      # Infisical: 1 = segredos vêm do Infisical; 0/ausente = só .env.
      # Com 1, defina no .env: INFISICAL_UNIVERSAL_AUTH_CLIENT_ID/SECRET (machine identity),
      # INFISICAL_PROJECT_ID e, se instância própria, INFISICAL_API_URL.
      USE_INFISICAL: ${USE_INFISICAL:-0}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
    volumes:
      # Tools personalizadas. As oficiais vêm na imagem: não monte ./tools por cima.
      - ./custom_tools:/app/custom_tools:ro
